aid: everlance
name: Everlance
description: 'Everlance is an automatic mileage and expense tracking platform for self-employed
  professionals, gig workers, contractors, and businesses, building an infrastructure
  platform for the self-employed. Its apps capture GPS-based mileage automatically, sync
  bank and credit-card transactions to categorize expenses, surface tax deductions, and
  generate IRS-compliant reports. For teams and enterprises, Everlance offers a Business
  API that enables uni-directional data transfer into the platform to keep user profiles,
  user attributes, team structure and roles, and favorite places up to date, plus an HR
  integration (powered by Merge) that syncs employee details from 100+ HRIS systems such
  as ADP, UKG, and Workday. The Business API authenticates with a Bearer access token
  provisioned by the Everlance team.'
